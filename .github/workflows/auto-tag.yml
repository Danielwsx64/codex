name: Auto tag

on:
  push:
    branches: [main]

# Serialize so two merges in quick succession can't race on tag creation.
concurrency:
  group: auto-tag
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      created: ${{ steps.resolve.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the existing tags are available locally.
          fetch-depth: 0

      - name: Create tag when Cargo.toml version is new
        id: resolve
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The tag's existence is the idempotency check: it covers re-runs,
          # merges that don't touch Cargo.toml, and reverts back to a shipped
          # version.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag already exists, nothing to release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "release: $tag"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::created $tag"

  release:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
