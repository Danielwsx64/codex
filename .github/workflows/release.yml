name: Release

on:
  # Manual path: pushing a v* tag by hand still publishes a release.
  push:
    tags:
      - "v*"
  # Automated path: called by auto-tag.yml after it creates the tag. A tag
  # pushed with GITHUB_TOKEN does not trigger `on: push`, so the caller has to
  # invoke this workflow directly.
  workflow_call:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast if the tag doesn't match the Cargo.toml version, so the
  # published binaries can never disagree with `cdx --version`.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check tag matches Cargo.toml version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="${TAG#v}"
          crate=$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          asset="cdx-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/cdx" "dist/$asset"
          strip "dist/$asset" || true
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cdx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Passed explicitly: on the workflow_call path GITHUB_REF points at
          # the caller's branch, so the tag can't be inferred.
          tag_name: ${{ inputs.tag || github.ref_name }}
          # Notes are generated from the commits/PRs since the previous tag.
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
